name: Build Xpra AppImage

on:
  workflow_dispatch:
    inputs:
      xpra_repo:
        description: 'Which Xpra repo to build from'
        required: true
        default: 'official'
        type: choice
        options:
          - official
          - c0xc-fork
      ref:
        description: 'Git tag or branch to check out'
        required: false
        default: 'master'
  push:
    branches:
      - master
      - test

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4
      - name: Print env
        run: |
          echo "[GH runner]"
          df -h
          pwd
          ls -la
      - name: Fix workspace permissions
        run: sudo chmod 777 ${{ github.workspace }}
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u c0xc --password-stdin
      - name: Find latest monthly builder image
        id: find_image
        run: |
          IMAGE_REF="ghcr.io/${{ github.repository_owner }}/xpra-appimage/builder"
          # push_builder.sh tags latest + monthly-YYYY-MM. Resolve the newest
          # monthly image with docker pull (already authenticated here), no
          # registry API: current month, then the previous month, then latest.
          for TAG in "monthly-$(date +%Y-%m)" \
                     "monthly-$(date +%Y-%m -d '1 month ago')" \
                     "latest"; do
            if docker pull "$IMAGE_REF:$TAG" >/dev/null 2>&1; then
              echo "builder_image=$IMAGE_REF:$TAG" >> $GITHUB_OUTPUT
              echo "Using image: $IMAGE_REF:$TAG"
              exit 0
            fi
          done
          echo "builder_image=$IMAGE_REF:latest" >> $GITHUB_OUTPUT
          echo "No monthly tag found, using :latest"
      - name: Pull builder image
        run: |
          docker pull ${{ steps.find_image.outputs.builder_image }}
      - name: Run build
        run: |
          USE_FORK=false
          FORK_REPO_URL=""
          if [ "${{ github.event.inputs.xpra_repo }}" = "c0xc-fork" ]; then
            USE_FORK=true
            FORK_REPO_URL="https://github.com/c0xc/xpra.git"
          fi
          docker run --rm \
            -e USE_FORK="$USE_FORK" \
            -e FORK_REPO_URL="$FORK_REPO_URL" \
            -e REPO_BRANCH="${{ github.event.inputs.ref }}" \
            -v ${{ github.workspace }}:/workspace ${{ steps.find_image.outputs.builder_image }}
          df -h
          pwd
          ls -la
          echo "[GH runner] Build complete"
          ls -ld ${{ github.workspace }}
          ls -lAh ${{ github.workspace }}/build
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpra-appimage
          path: ${{ github.workspace }}/build/Xpra-x86_64.AppImage
